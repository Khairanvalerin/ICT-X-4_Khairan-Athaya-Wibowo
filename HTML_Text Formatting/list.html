<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML List</title>
    <link rel="stylesheet" href="Style.css" />
  </head>
  <body>
    <h1>HTML List</h1>
    <hr />
    <ol>
      <li>Monday</li>
      <li>Tuesday</li>
      <li>Wednesday</li>
    </ol>
    <ol type="I">
      <li>Monday</li>
      <li>Tuesday</li>
      <li>Wednesday</li>
    </ol>
    <ol type="A">
      <li>Monday</li>
      <li>Tuesday</li>
      <li>Wednesday</li>
    </ol>
    <ul>
      <li>Monday</li>
      <li>Tuesday</li>
      <li>Wednesday</li>
    </ul>
    <ul type="circle">
      <li>Monday</li>
      <li>Tuesday</li>
      <li>Wednesday</li>
    </ul>
    <ul type="square">
      <li>Monday</li>
      <li>Tuesday</li>
      <li>Wednesday</li>
    </ul>
    <hr />
    <dl>
      <dt>HTML</dt>
      <dd>HyperText Markup Language</dd>
      <dt>CSS</dt>
      <dd>Cascading Style Sheets</dd>
    </dl>
    <script src="Script.js"></script>
  </body>
</html>
